name: Update Circulars Feed

on:
  schedule:
    - cron: '30 2,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-circulars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 pypdf

      - name: Fetch government notifications and update circulars.json
        run: python scripts/update_circulars.py

      - name: Commit and push updated circulars.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add circulars.json
          if git diff --staged --quiet; then
            echo "No new government notifications found."
          else
            git commit -m "chore: auto-update circulars.json from government notifications"
            git push
          fi
